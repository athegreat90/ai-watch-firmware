name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: arduino/setup-arduino-cli@b3cda96fddef6af6c56b4c5efb5c47e2357935db
      - shell: pwsh
        run: ./scripts/setup-arduino.ps1
      - shell: pwsh
        run: ./scripts/build-firmware.ps1
      - run: g++ -std=c++17 -fsyntax-only tests/focus_timer.cpp
      - run: python3 security/firmware_inventory.py
