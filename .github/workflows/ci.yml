name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: arduino/setup-arduino-cli@b3cda96fddef6af6c56b4c5efb5c47e2357935db
      - shell: pwsh
        run: ./scripts/setup-arduino.ps1
      - shell: pwsh
        run: ./scripts/build-firmware.ps1
      - run: g++ -std=c++17 -fsyntax-only tests/focus_timer.cpp
      - run: python3 security/firmware_inventory.py

  release-eligibility:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 release/automatic.py eligibility
      - name: Mark qualifying changes
        if: steps.changes.outputs.qualifies == 'true'
        run: echo "Shipped files changed in this push."
